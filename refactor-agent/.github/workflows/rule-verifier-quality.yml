name: rule-verifier-quality

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          cd rule-verifier
          python3 -m pip install -r requirements.txt
          python3 -m pip install ruff mypy pre-commit
      - name: Run parity gates
        run: |
          cd rule-verifier
          pre-commit run --all-files
          python3 -m ruff check src tests
          python3 -m mypy src
          pytest -q
