repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff-check
        entry: /bin/zsh -lc 'cd /Users/adamjackson/Projects/code-research/refactor-agent/rule-verifier && python3 -m ruff check src tests'
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: /bin/zsh -lc 'cd /Users/adamjackson/Projects/code-research/refactor-agent/rule-verifier && python3 -m mypy src'
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: /bin/zsh -lc 'cd /Users/adamjackson/Projects/code-research/refactor-agent/rule-verifier && python3 -m pytest -q'
        language: system
        pass_filenames: false
